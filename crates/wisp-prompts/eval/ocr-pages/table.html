<!doctype html>
<!--
  O2-table-markdown：文档里的一张表。一级标题、一段说明、二级标题、带表头的表格与表下的注释，
  结构化输出应得到两级标题与一张 Markdown 表格。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>table</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      #shot {
        width: 620px;
        background: #fff;
        padding: 28px 32px 26px;
        font-size: 14px;
        line-height: 1.6;
        color: #24292f;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        line-height: 1.25;
        padding-bottom: 8px;
        border-bottom: 1px solid #d8dee4;
      }
      h1 + p {
        margin-top: 12px;
      }
      h2 {
        margin: 22px 0 10px;
        font-size: 18px;
        font-weight: 600;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border: 1px solid #d0d7de;
        padding: 6px 12px;
        text-align: left;
      }
      th {
        background: #f6f8fa;
        font-weight: 600;
      }
      td.n,
      th.n {
        text-align: right;
      }
      .note {
        margin-top: 10px;
        font-size: 12px;
        color: #656d76;
      }
    </style>
  </head>
  <body>
    <main id="shot">
      <h1>第三季度服务用量</h1>
      <p>以下数据来自各服务商的账单导出，统计区间为 7 月 1 日至 9 月 30 日。</p>
      <h2>按服务商汇总</h2>
      <table>
        <thead>
          <tr>
            <th>服务商</th>
            <th class="n">请求数</th>
            <th class="n">输入 Token</th>
            <th class="n">输出 Token</th>
            <th class="n">失败率</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>OpenAI 兼容</td>
            <td class="n">12,480</td>
            <td class="n">3.2M</td>
            <td class="n">0.9M</td>
            <td class="n">0.4%</td>
          </tr>
          <tr>
            <td>Anthropic</td>
            <td class="n">8,315</td>
            <td class="n">2.7M</td>
            <td class="n">1.1M</td>
            <td class="n">0.2%</td>
          </tr>
          <tr>
            <td>Gemini</td>
            <td class="n">5,902</td>
            <td class="n">1.8M</td>
            <td class="n">0.5M</td>
            <td class="n">1.3%</td>
          </tr>
          <tr>
            <td>本机模型</td>
            <td class="n">2,067</td>
            <td class="n">0.6M</td>
            <td class="n">0.2M</td>
            <td class="n">0.0%</td>
          </tr>
        </tbody>
      </table>
      <p class="note">注：失败率只统计服务端返回的错误，不含用户主动取消的请求。</p>
    </main>
  </body>
</html>
