[package]
edition = "2024"
rust-version = "1.95"
name = "oar-ocr-core"
version = "0.10.0"
authors = ["Wang Xin <xinwang614@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core types and predictors for oar-ocr"
homepage = "https://github.com/greatv/oar-ocr"
readme = "README.md"
keywords = [
    "ocr",
    "onnx",
    "computer-vision",
    "text-recognition",
    "machine-learning",
]
categories = [
    "computer-vision",
    "science",
]
license = "Apache-2.0"
repository = "https://github.com/greatv/oar-ocr"
resolver = "2"

[features]
auto-download = [
    "dep:ureq",
    "dep:sha2",
    "dep:dirs",
]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
# Wisp patch: the new `formula` and `image-formats` features are on by default, so default builds behave as upstream.
default = [
    "download-binaries",
    "simd",
    "formula",
    "image-formats",
]
# Wisp patch: formula recognition is the only user of `tokenizers` (which pulls in the Oniguruma C library).
formula = ["dep:tokenizers"]
# Wisp patch: every `image` decoder (avif/rav1e, exr, tiff, webp, ...) used to be forced on through `image` and
# `imageproc` default features; OCR itself only needs in-memory pixel buffers.
image-formats = ["image/default"]
directml = ["ort/directml"]
download-binaries = [
    "ort/download-binaries",
    "ort/tls-native",
]
openvino = ["ort/openvino"]
simd = [
    "dep:wide",
    "dep:multiversion",
]
tensorrt = ["ort/tensorrt"]
webgpu = ["ort/webgpu"]

[lib]
name = "oar_ocr_core"
path = "src/lib.rs"

[dependencies.clipper2-rust]
version = "1.0.3"

[dependencies.dirs]
version = "7.0"
