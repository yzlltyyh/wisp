<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Wisp 应用图标源稿：靛蓝圆角方块 + 发光的「鬼火」。由 `pnpm tauri icon icons/source-1024.png -o icons` 生成各尺寸 -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="0.55" stop-color="#3C3FD8"/>
      <stop offset="1" stop-color="#26208F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9AD8FF" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#9AD8FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9AD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F0FF"/>
    </linearGradient>
    <linearGradient id="core" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7FE3FF"/>
      <stop offset="1" stop-color="#4A8DFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <rect x="104" y="124" width="816" height="816" rx="186" fill="#0B0A3A" opacity="0.35" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
    <ellipse cx="512" cy="560" rx="400" ry="400" fill="url(#glow)"/>
  </g>
  <path d="M512 800 C402 800 324 722 324 614 C324 528 370 466 420 412 C464 364 498 322 506 262 C508 246 520 238 532 246 C628 304 700 404 700 560 C700 696 620 800 512 800 Z" fill="#BFE6FF" opacity="0.55" filter="url(#soft)"/>
  <path d="M512 800 C402 800 324 722 324 614 C324 528 370 466 420 412 C464 364 498 322 506 262 C508 246 520 238 532 246 C628 304 700 404 700 560 C700 696 620 800 512 800 Z" fill="url(#flame)"/>
  <path d="M512 736 C454 736 412 694 412 638 C412 588 446 552 480 518 C500 498 514 476 520 448 C574 488 612 548 612 628 C612 692 568 736 512 736 Z" fill="url(#core)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
</svg>
