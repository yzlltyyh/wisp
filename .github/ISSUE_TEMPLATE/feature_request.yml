name: 功能建议 / Feature request
description: 建议新功能或改进现有功能 / Suggest a new feature or an improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Wisp 刻意只做截图 OCR、划词翻译与剪贴板三件事。提交前请先看 README 的[不做什么](https://github.com/yzlltyyh/wisp#不做什么)与[路线图](https://github.com/yzlltyyh/wisp#路线图)，并搜索[已有的 issue](https://github.com/yzlltyyh/wisp/issues)。
        Wisp deliberately focuses on screenshot OCR, selection translation, and clipboard history. Please check the [non-goals](https://github.com/yzlltyyh/wisp/blob/main/README.en.md#non-goals), the [roadmap](https://github.com/yzlltyyh/wisp/blob/main/README.en.md#roadmap), and [existing issues](https://github.com/yzlltyyh/wisp/issues) first.
  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能 / Area
      multiple: true
      options:
        - 划词翻译 / Selection translation
        - 截图 OCR / Screenshot OCR
        - 剪贴板 / Clipboard history
        - 快捷键与触发 / Shortcuts and triggers
        - 模型服务 / Model providers
        - 外观与设置 / Appearance and settings
        - 其他 / Other
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 你在什么场景下遇到了什么不便？/ What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposed solution
      description: 你希望 Wisp 怎样表现；有参考的应用或截图更好 / How should Wisp behave? References or mockups are welcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: dropdown
    id: platforms
    attributes:
      label: 你使用的平台 / Your platforms
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
